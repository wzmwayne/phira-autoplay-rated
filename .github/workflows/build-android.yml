name: Build Android

on:
  workflow_dispatch:

env:
  PRPR_AVC_FFMPEG_VERSION: 20260730_v0

jobs:
  build:
    name: Build Android native libs (arm64 + armv7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android armv7-linux-androideabi

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Configure Cargo toolchain
        run: |
          BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android21-clang++"
            echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$BIN/armv7a-linux-androideabi21-clang++"
            echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android21-clang"
            echo "CXX_aarch64_linux_android=$BIN/aarch64-linux-android21-clang++"
            echo "CC_armv7_linux_androideabi=$BIN/armv7a-linux-androideabi21-clang"
            echo "CXX_armv7_linux_androideabi=$BIN/armv7a-linux-androideabi21-clang++"
            echo "AR_aarch64_linux_android=$BIN/llvm-ar"
            echo "AR_armv7_linux_androideabi=$BIN/llvm-ar"
            echo "RANLIB_aarch64_linux_android=$BIN/llvm-ranlib"
            echo "RANLIB_armv7_linux_androideabi=$BIN/llvm-ranlib"
          } >> "$GITHUB_ENV"

      - name: Download FFmpeg static libs
        run: |
          for t in aarch64-linux-android armv7-linux-androideabi; do
            mkdir -p "prpr-avc/static-lib/$t"
            curl -fL --retry 3 -o "$t.tar.gz" \
              "https://github.com/TeamFlos/prpr-avc-ffmpeg/releases/download/${PRPR_AVC_FFMPEG_VERSION}/$t.tar.gz"
            tar -xzf "$t.tar.gz" -C "prpr-avc/static-lib/$t"
          done

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          cache-all-crates: "true"

      - name: Build
        run: cargo build --release -p phira --target aarch64-linux-android --target armv7-linux-androideabi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: phira-android-libs
          path: |
            target/aarch64-linux-android/release/libphira.so
            target/armv7-linux-androideabi/release/libphira.so