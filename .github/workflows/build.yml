name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PRPR_AVC_FFMPEG_VERSION: 20260309_v0

jobs:
  build-linux:
    name: Build Linux x86_64 (release)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Prepare system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            librust-alsa-sys-dev libglib2.0-dev libasound2t64 \
            libatk-adaptor libgail-common libgtk-3-dev

      - name: Setup Rust toolchain
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-gnu

      - name: Download FFmpeg static libs
        run: |
          mkdir -p prpr-avc/static-lib/x86_64-unknown-linux-gnu
          curl -fL --retry 3 \
            -o prpr-avc-static-lib.tar.gz \
            https://github.com/TeamFlos/prpr-avc-ffmpeg/releases/download/${PRPR_AVC_FFMPEG_VERSION}/x86_64-unknown-linux-gnu.tar.gz
          tar -xzf prpr-avc-static-lib.tar.gz -C prpr-avc/static-lib/x86_64-unknown-linux-gnu

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          cache-all-crates: "true"

      - name: Build
        run: |
          cargo build --release -p phira-main

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: phira-autoplay-rated-linux-x86_64
          path: |
            target/release/phira-main
            target/release/phira-main.d

      - name: Show build info
        run: ls -lh target/release/phira-main