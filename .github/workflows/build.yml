name: Build Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PRPR_AVC_FFMPEG_VERSION: 20260309_v0
  NDK_VERSION: "26.3.11579264"

jobs:
  build-android:
    name: Build Android native libs (arm64 + armv7)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Prepare system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            librust-alsa-sys-dev libglib2.0-dev libasound2t64 \
            libatk-adaptor libgail-common libgtk-3-dev

      - name: Setup Rust toolchain
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android armv7-linux-androideabi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" --sdk_root="$ANDROID_HOME"
          echo "NDK=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure Cargo for Android targets
        run: |
          NDK_TOOLS="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CC_aarch64_linux_android=$NDK_TOOLS/aarch64-linux-android21-clang"
            echo "CXX_aarch64_linux_android=$NDK_TOOLS/aarch64-linux-android21-clang++"
            echo "AR_aarch64_linux_android=$NDK_TOOLS/llvm-ar"
            echo "RANLIB_aarch64_linux_android=$NDK_TOOLS/llvm-ranlib"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_TOOLS/aarch64-linux-android21-clang"
            echo "CC_armv7_linux_androideabi=$NDK_TOOLS/armv7a-linux-androideabi21-clang"
            echo "CXX_armv7_linux_androideabi=$NDK_TOOLS/armv7a-linux-androideabi21-clang++"
            echo "AR_armv7_linux_androideabi=$NDK_TOOLS/llvm-ar"
            echo "RANLIB_armv7_linux_androideabi=$NDK_TOOLS/llvm-ranlib"
            echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$NDK_TOOLS/armv7a-linux-androideabi21-clang"
          } >> "$GITHUB_ENV"

      - name: Download FFmpeg static libs (android)
        run: |
          for t in aarch64-linux-android armv7-linux-androideabi; do
            mkdir -p "prpr-avc/static-lib/$t"
            curl -fL --retry 3 -o "$t.tar.gz" \
              "https://github.com/TeamFlos/prpr-avc-ffmpeg/releases/download/${PRPR_AVC_FFMPEG_VERSION}/$t.tar.gz"
            tar -xzf "$t.tar.gz" -C "prpr-avc/static-lib/$t"
          done

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          cache-all-crates: "true"

      - name: Build native libraries
        run: |
          cargo build --release -p phira \
            --target aarch64-linux-android \
            --target armv7-linux-androideabi

      - name: Upload libraries
        uses: actions/upload-artifact@v4
        with:
          name: phira-android-libs
          path: |
            target/aarch64-linux-android/release/libphira.so
            target/armv7-linux-androideabi/release/libphira.so

      - name: Show build info
        run: ls -lh target/*/release/libphira.so